name: Windows cloud acceptance pilot

on:
  # Draft PRs run too. Branch pushes are deliberately main-only to avoid
  # running twice for a feature branch that already has an open PR.
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-cloud-pilot-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  # pull_request checks out GitHub's proposed merge, not the head alone.
  WORKBENCH_CI_EVENT: ${{ github.event_name }}
  WORKBENCH_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  WORKBENCH_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}

jobs:
  linux-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Actions workflow semantics and historical context regression
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          directory="$(mktemp -d "$RUNNER_TEMP/ono-actionlint.XXXXXX")"
          trap 'rm -rf -- "$directory"' EXIT
          curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 --proto '=https' --tlsv1.2 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$directory/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $directory/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$directory/actionlint.tar.gz" -C "$directory" actionlint
          node tooling/check-workflows.mjs "$directory/actionlint"
      - name: Read-only system Chrome eligibility (no page or renderer)
        timeout-minutes: 1
        run: |
          node --input-type=module <<'NODE'
          import { verifySystemChrome } from './tooling/ono/render-pilot/system-chrome.mjs';
          import { runStage, formatDiagnostic } from './tooling/ono/render-pilot/diagnostics.mjs';
          try { await runStage('system_chrome', () => verifySystemChrome()); }
          catch (error) { console.error(formatDiagnostic(error)); process.exitCode = 1; }
          NODE
      - name: Install locked dependencies without browser downloads or cache uploads
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Typography, types and production build
        run: npm run verify

  windows-installed-app:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      # Use official upstream downloads instead of the repository's local mirror defaults.
      ELECTRON_MIRROR: 'https://github.com/electron/electron/releases/download/'
      ELECTRON_BUILDER_BINARIES_MIRROR: 'https://github.com/electron-userland/electron-builder-binaries/releases/download/'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked Windows dependencies
        run: npm ci --no-audit --no-fund
      - name: Download the locked Electron Windows runtime explicitly
        run: node node_modules/electron/install.js
      - name: Unit tests including Windows release packaging fixture
        run: npm test
      - name: Typography, types and production build
        run: npm run verify
      - name: Build real NSIS installer without release upload or portable ZIP
        run: node node_modules/electron-builder/cli.js --win nsis --x64 --publish never --config.electronDist=node_modules/electron/dist
      - name: Silent current-user installation into disposable runner directory
        shell: pwsh
        run: ./tooling/windows-pilot-install.ps1
      - name: Installed app UI flow and same-version persistence
        run: npm run test:windows-pilot
      # The only artifact upload in the entire run. Linux produces no artifact.
      - name: Enforce screenshot/report allowlist and 20 MB total run ceiling
        id: evidence
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'test-results/windows-pilot') {
            node tooling/pilot-artifacts.mjs test-results/windows-pilot
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            'safe=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
      - name: Retain only small screenshots and reports for 3 days
        if: always() && steps.evidence.outputs.safe == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-cloud-pilot-${{ github.run_id }}
          # A re-run replaces the same run's evidence instead of accumulating it.
          overwrite: true
          path: test-results/windows-pilot/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
